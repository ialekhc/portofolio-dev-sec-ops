AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Simple CloudFormation template for CC7010NI portfolio deployment.
  Provisions one EC2 instance and security group for SSH and HTTP.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 KeyPair name for SSH access.

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
    Description: EC2 instance type.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI from AWS Systems Manager Parameter Store.

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      CIDR allowed to SSH to EC2 (for demo convenience). Restrict this to your IP in production.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}(\\/\\d{1,2})$"
    ConstraintDescription: Must be a valid CIDR range in format x.x.x.x/x.

Resources:
  PortfolioSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP and SSH access for portfolio EC2 instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: portfolio-sg
        - Key: Project
          Value: portfolio-devqaops

  PortfolioEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref PortfolioSecurityGroup
      Tags:
        - Key: Name
          Value: portfolio-devqaops-ec2
        - Key: Module
          Value: CC7010NI
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          # Update packages.
          dnf update -y || yum update -y

          # Install Docker.
          dnf install -y docker || yum install -y docker

          # Start and enable Docker service.
          systemctl start docker
          systemctl enable docker

          # Allow ec2-user to run docker without sudo after re-login.
          usermod -aG docker ec2-user

          # Optional demo container to confirm Docker is working.
          docker run -d --name bootstrap-nginx -p 8080:80 nginx:alpine || true

Outputs:
  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref PortfolioEC2Instance

  PublicIP:
    Description: Public IP address of EC2 instance
    Value: !GetAtt PortfolioEC2Instance.PublicIp

  WebsiteURL:
    Description: Public URL for portfolio website
    Value: !Sub "http://${PortfolioEC2Instance.PublicIp}"
