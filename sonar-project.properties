# Sonar project identifiers
# Keep identifiers empty here; CI injects effective values via workflow/secrets.
sonar.projectKey=
sonar.organization=
sonar.projectName=Portfolio DevQAOps

# Source settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,dist/**,build/**,.github/**
