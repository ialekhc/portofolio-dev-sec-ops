# Sonar project identifiers
# These values can be overridden by GitHub Actions arguments.
sonar.projectKey=your_sonar_project_key
sonar.organization=your_sonar_organization
sonar.projectName=Portfolio DevQAOps

# Source settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,dist/**,build/**,.github/**
