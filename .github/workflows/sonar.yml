name: Sonar Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sonar:
    name: Sonar Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate SonarQube secrets
        run: |
          [ -n "${{ secrets.SONAR_TOKEN }}" ] || { echo "Missing SONAR_TOKEN secret"; exit 1; }
          [ -n "${{ secrets.SONAR_PROJECT_KEY }}" ] || { echo "Missing SONAR_PROJECT_KEY secret"; exit 1; }
          [ -n "${{ secrets.SONAR_HOST_URL }}" ] || { echo "Missing SONAR_HOST_URL secret"; exit 1; }

      - name: SonarQube static analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            "-Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}"
