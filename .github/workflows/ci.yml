name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sonar:
    name: Sonar Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Sonar secrets
        run: |
          [ -n "${{ secrets.SONAR_TOKEN }}" ] || { echo "Missing SONAR_TOKEN secret"; exit 1; }
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ] && [ -z "${{ secrets.SONAR_ORGANIZATION }}" ]; then
            echo "Set SONAR_HOST_URL (self-hosted SonarQube) or SONAR_ORGANIZATION (SonarCloud)."
            exit 1
          fi

      - name: Resolve Sonar project key
        run: |
          PROJECT_KEY="${{ secrets.SONAR_PROJECT_KEY }}"

          if [ -z "$PROJECT_KEY" ] && [ -f sonar-project.properties ]; then
            PROJECT_KEY="$(grep -E '^sonar\\.projectKey=' sonar-project.properties | head -n1 | cut -d= -f2-)"
          fi

          if [ -z "$PROJECT_KEY" ]; then
            PROJECT_KEY="${GITHUB_REPOSITORY//\//_}"
          fi

          PROJECT_KEY="$(echo "$PROJECT_KEY" | sed 's/[^A-Za-z0-9._:-]/_/g')"
          [ -n "$PROJECT_KEY" ] || { echo "Unable to resolve Sonar project key"; exit 1; }

          echo "SONAR_PROJECT_KEY_EFFECTIVE=$PROJECT_KEY" >> "$GITHUB_ENV"
          echo "Using Sonar project key: $PROJECT_KEY"

      - name: Resolve Sonar mode
        run: |
          if [ -n "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "SONAR_MODE=self_hosted" >> "$GITHUB_ENV"
          else
            echo "SONAR_MODE=sonarcloud" >> "$GITHUB_ENV"
          fi

      - name: SonarQube static analysis (self-hosted)
        if: ${{ env.SONAR_MODE == 'self_hosted' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY_EFFECTIVE }}

      - name: SonarCloud static analysis
        if: ${{ env.SONAR_MODE == 'sonarcloud' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY_EFFECTIVE }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolio-devqaops:latest .

      - name: Save Docker image as tar file
        run: docker save portfolio-devqaops:latest -o portfolio-devqaops.tar

      - name: Upload Docker image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-image
          path: portfolio-devqaops.tar
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: [sonar, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate EC2 deployment secrets
        run: |
          [ -n "${{ secrets.EC2_HOST }}" ] || { echo "Missing EC2_HOST secret"; exit 1; }
          [ -n "${{ secrets.EC2_USER }}" ] || { echo "Missing EC2_USER secret"; exit 1; }
          [ -n "${{ secrets.EC2_SSH_KEY }}" ] || { echo "Missing EC2_SSH_KEY secret"; exit 1; }

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-image

      - name: Copy Docker image to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "portfolio-devqaops.tar"
          target: "/home/${{ secrets.EC2_USER }}/"

      - name: Load image and run container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}

            sudo docker load -i portfolio-devqaops.tar

            if [ "$(sudo docker ps -aq -f name=portfolio-container)" ]; then
              sudo docker stop portfolio-container || true
              sudo docker rm portfolio-container || true
            fi

            sudo docker run -d \
              --name portfolio-container \
              --restart unless-stopped \
              -p 80:80 \
              portfolio-devqaops:latest

            rm -f portfolio-devqaops.tar
            sudo docker system prune -f
